<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Transform</title>

    <style>

        .red {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 800px;
            height: 800px;

            border: 2px solid beige;
            background-color: black;

          
            perspective: 300px;
        }

        button {

            border: 3px solid black;

            display: flex;
            justify-content: center;
            align-items: center;

            width: 300px;
            height: 200px;

            cursor: pointer;

            transition: all 0.9s cubic-bezier(
                0.075,
                0.82,
                0.165,
                1
            );
        }

        button:hover {

            background-color: gold;

            border-radius: 30px;

            width: 170px;

            color: transparent;

            font-size: 0;

            transform:
                translate3d(100px, 50px, 100px)
                rotateY(-45deg);
        }

        button:hover::after {

            content: "jokes on you";

            font-size: 10px;
            color: black;
        }

    </style>

</head>

<body>

    <div class="red">

        <button>
            click me
        </button>

    </div>

</body>

</html>
